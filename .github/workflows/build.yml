name: Build & Release Roblox Watcher

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Suite on macOS
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read App Version
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Execute Build Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Build Artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Watcher-v${{ steps.get_version.outputs.version }}
          path: |
            Roblox-Watcher-*.dmg
            roblox-watcher
          retention-days: 14

      - name: Publish GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Roblox Watcher v${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          files: |
            Roblox-Watcher-*.dmg
            roblox-watcher

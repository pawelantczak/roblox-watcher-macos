name: Build & Release Roblox Watcher

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Suite on macOS
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read App Version
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Run Automated Test Suite
        run: |
          chmod +x test.sh
          ./test.sh

      - name: Execute Build Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Build Artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Watcher-v${{ steps.get_version.outputs.version }}
          path: |
            Roblox-Watcher-*.zip
            roblox-watcher-v*
          retention-days: 14

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 -c "
          import re, sys
          ver = '${{ steps.get_version.outputs.version }}'.lstrip('v')
          with open('CHANGELOG.md', 'r') as f:
              text = f.read()
          pat = rf'## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          m = re.search(pat, text, re.DOTALL)
          notes = m.group(1).strip() if m else ''
          if not notes:
              unrel = re.search(r'## \[Unreleased\][^\n]*\n(.*?)(?=\n## \[|\Z)', text, re.DOTALL)
              notes = unrel.group(1).strip() if unrel else 'Release v' + ver
          notes = re.sub(r'\n---\s*$', '', notes).strip()
          with open('RELEASE_NOTES.md', 'w') as out:
              out.write(notes + '\n')
          "

      - name: Publish GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Roblox Watcher v${{ steps.get_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            Roblox-Watcher-*.zip
            roblox-watcher-v*
